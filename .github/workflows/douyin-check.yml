name: 抖音接口接入检查（手动）

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: douyin-daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 检查应用令牌和一次视频搜索
        env:
          DOUYIN_CLIENT_KEY: ${{ secrets.DOUYIN_CLIENT_KEY }}
          DOUYIN_CLIENT_SECRET: ${{ secrets.DOUYIN_CLIENT_SECRET }}
          DOUYIN_DEVICE_ID: ${{ secrets.DOUYIN_DEVICE_ID }}
          DOUYIN_ACCESS_TOKEN: ${{ secrets.DOUYIN_ACCESS_TOKEN }}
        run: node douyin-monitor/cli.js check
