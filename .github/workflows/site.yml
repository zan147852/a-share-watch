name: 发布观察台界面
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: site-interface-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 检查前端语法
        run: |
          node --check public/app.js
          node --check public/relay-rules.js
          node --check public/relay-ui.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: 发布界面与现有数据
        id: deployment
        uses: actions/deploy-pages@v4
